name: Build App Blocker APK

on:
  push:
    branches:
      - main
      - claude/app-blocker-time-limits-m7ikby
    paths:
      - 'apps/android-blocker/**'
      - '.github/workflows/android-blocker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-blocker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-blocker-apk
          path: apps/android-blocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
