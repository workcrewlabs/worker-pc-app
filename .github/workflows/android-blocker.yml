name: Build App Blocker APK

on:
  push:
    branches:
      - main
      - claude/app-blocker-time-limits-m7ikby
    paths:
      - 'apps/android-blocker/**'
      - '.github/workflows/android-blocker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-blocker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A cold run downloads the whole Gradle distribution, and an outage of
      # that one download is enough to fail the build however healthy the code
      # is. Keeping it between runs removes that as a way for CI to break.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/gradle-dist
            ~/.gradle/caches
          key: gradle-${{ hashFiles('apps/android-blocker/gradle/wrapper/gradle-wrapper.properties', 'apps/android-blocker/**/*.gradle.kts') }}
          restore-keys: gradle-

      # The wrapper makes exactly one attempt at the download, and Gradle's
      # distribution endpoint has been answering 504 intermittently, which
      # fails the build before a line of code is compiled. Fetching it here
      # with retries rides that out. Deliberately a separate step from the
      # build: a retry must never be able to mask a real build or test
      # failure, and `curl -f` still fails the job if the endpoint stays down.
      # The version comes from the wrapper properties so there is one source
      # of truth, and ./gradlew stays the way to build locally.
      - name: Fetch Gradle
        run: |
          set -euo pipefail
          version="$(sed -n \
            's#^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(all\|bin\)\.zip#\1#p' \
            gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "could not read the Gradle version from gradle-wrapper.properties" >&2
            exit 1
          fi
          bin="$HOME/gradle-dist/gradle-$version/bin"
          if [ ! -x "$bin/gradle" ]; then
            echo "fetching Gradle $version"
            curl -fL --retry 12 --retry-delay 15 --retry-all-errors \
              --connect-timeout 30 --max-time 1800 -o "$RUNNER_TEMP/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-$version-all.zip"
            mkdir -p "$HOME/gradle-dist"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/gradle-dist"
            rm -f "$RUNNER_TEMP/gradle.zip"
          else
            echo "using cached Gradle $version"
          fi
          "$bin/gradle" --version
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-blocker-apk
          path: apps/android-blocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish to a fixed release so the APK has a stable one-tap
      # download URL (the run artifact is a zip and is hidden in the mobile app).
      - name: Publish APK to the app-blocker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create app-blocker \
            --title "App Blocker APK" \
            --notes "Latest App Blocker build. Download app-debug.apk below and open it on your phone to install." \
            --target "${{ github.sha }}" || true
          gh release upload app-blocker app/build/outputs/apk/debug/app-debug.apk --clobber
