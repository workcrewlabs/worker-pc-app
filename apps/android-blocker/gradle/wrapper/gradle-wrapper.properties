distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The -all archive rather than -bin: services.gradle.org redirects to Gradle's
# releases on GitHub, where the -bin asset has been answering 504 for every
# version while -all downloads fine. Same Gradle, just the fuller archive.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# Two minutes rather than the wrapper's default ten seconds: the -all archive
# above is the larger download, and the ten-second read timeout was tuned for
# the smaller -bin one.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
