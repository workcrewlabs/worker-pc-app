<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WorkCrew</title>
    <style>
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 18px;
        width: 320px;
        color: #1c1c1c;
        background: #fff;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #555; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      button {
        margin-top: 12px;
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #1c1c1c;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #status { margin-top: 12px; font-weight: 600; }
      .ok { color: #1a7f37; }
      .bad { color: #b42318; }
    </style>
  </head>
  <body>
    <h1>Connect to WorkCrew</h1>
    <p>Open WorkCrew, go to Settings, and copy the browser connection code. Paste it here once.</p>
    <label for="token">Connection code</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <button id="save">Connect</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
