# Render Blueprint for the WorkCrew backend.
# In Render, choose New, then Blueprint, and point it at this repository. Render
# reads this file and creates the service. Values marked sync: false must be
# pasted by you in the Render dashboard and are never stored in this file or in
# Git. WORKCREW_LOCAL_AUTH_SECRET is generated by Render automatically.
services:
  - type: web
    name: workcrew-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build -w @workcrew/contracts && npm run build -w @workcrew/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: local
      # No payment processor: customers pay the team directly and an admin turns
      # their access on from /admin. Access still expires by itself on the
      # paid-until date. Switch back to "stripe" when a card processor is live.
      - key: BILLING_MODE
        value: manual
      # Who may open the /admin dashboard: a comma-separated list of emails of
      # existing WorkCrew accounts. Empty closes the dashboard to everyone.
      - key: WORKCREW_ADMIN_EMAILS
        sync: false
      # Shown in the app when someone asks to upgrade while billing is manual.
      - key: WORKCREW_BILLING_CONTACT_EMAIL
        value: workcrew.support@gmail.com
      - key: WORKCREW_ALLOWED_ORIGINS
        value: app://workcrew
      - key: WORKCREW_LOCAL_AUTH_SECRET
        generateValue: true
      # Require a verified email before sign-in in production.
      - key: WORKCREW_REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # Production database is Supabase Postgres. Paste the Supabase Postgres
      # connection URI (it contains the database password). Backend only.
      - key: DATABASE_URL
        sync: false
      # Secrets, paste in the dashboard only.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Stripe settings are only needed when BILLING_MODE is "stripe". They are
      # listed here so switching back to card payments is a one-line change, and
      # they can be left unset (or deleted in the dashboard) under manual billing.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PRO_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_YEARLY_PRICE_ID
        sync: false
      # Public values, safe to paste in the dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Transactional email for verification and password reset. RESEND_API_KEY
      # is secret; EMAIL_FROM is the verified sender address on your domain.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The landing page download button target (the published installer link).
      - key: WORKCREW_DOWNLOAD_URL
        sync: false
